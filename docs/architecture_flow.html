<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HealthLink — End-to-End Flow</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  #cap{width:1640px;padding:0;}
  svg{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .title{font-size:30px;font-weight:700;fill:#0f172a;}
  .subtitle{font-size:15px;fill:#64748b;}
  .band{font-size:15px;font-weight:700;}
  .box-t{font-size:15px;font-weight:600;fill:#0f172a;}
  .box-s{font-size:12.5px;fill:#475569;}
  .lbl{font-size:12.5px;fill:#475569;}
  .lbl-i{font-size:12.5px;font-style:italic;fill:#64748b;}
  .num{font-size:14px;font-weight:700;fill:#ffffff;}
</style>
</head>
<body>
<div id="cap">
<svg width="1640" height="1180" viewBox="0 0 1640 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1640" height="1180" fill="#ffffff"/>
  <text x="40" y="46" class="title">HealthLink — Smart Health Management System</text>
  <text x="40" y="70" class="subtitle">End-to-end request flow · FastAPI · 4-agent pipeline · Google Gemini (LangChain 1.x) · Pinecone RAG · SQLite</text>

  <!-- ================= STARTUP BAND ================= -->
  <rect x="40" y="92" width="1560" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="120" class="band" fill="#475569">① Startup — FastAPI lifespan (main.py)</text>

  <!-- seed chain -->
  <rect x="70" y="140" width="200" height="70" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="170" text-anchor="middle" class="box-t">data/doctors.csv</text>
  <text x="170" y="190" text-anchor="middle" class="box-s">100 doctors · 30 specialties</text>

  <line x1="270" y1="175" x2="372" y2="175" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="321" y="167" text-anchor="middle" class="lbl-i">pandas</text>

  <rect x="374" y="140" width="220" height="70" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="484" y="170" text-anchor="middle" class="box-t">SQLite · seed_doctors()</text>
  <text x="484" y="190" text-anchor="middle" class="box-s">doctors table (idempotent)</text>

  <!-- kb chain -->
  <rect x="760" y="140" width="220" height="70" rx="9" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="870" y="170" text-anchor="middle" class="box-t">data/symptoms_kb.json</text>
  <text x="870" y="190" text-anchor="middle" class="box-s">200 conditions</text>

  <line x1="980" y1="175" x2="1082" y2="175" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="1031" y="167" text-anchor="middle" class="lbl-i">chunk + embed</text>

  <rect x="1084" y="140" width="240" height="70" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1204" y="170" text-anchor="middle" class="box-t">Pinecone index</text>
  <text x="1204" y="190" text-anchor="middle" class="box-s">"healthlink" · Gemini embeddings</text>

  <!-- ================= REQUEST ENTRY ROW ================= -->
  <rect x="40" y="278" width="240" height="86" rx="10" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="312" text-anchor="middle" class="box-t">Client</text>
  <text x="160" y="333" text-anchor="middle" class="box-s">Streamlit UI · curl · Swagger</text>
  <text x="160" y="351" text-anchor="middle" class="box-s">/docs</text>

  <line x1="280" y1="321" x2="392" y2="321" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="336" y="312" text-anchor="middle" class="lbl">POST</text>
  <text x="336" y="340" text-anchor="middle" class="lbl">/api/v1/assess</text>

  <rect x="394" y="278" width="250" height="86" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="519" y="308" text-anchor="middle" class="box-t">FastAPI · main.py</text>
  <text x="519" y="328" text-anchor="middle" class="box-s">CORS · routes · exception</text>
  <text x="519" y="346" text-anchor="middle" class="box-s">handler</text>

  <line x1="644" y1="321" x2="756" y2="321" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="700" y="312" text-anchor="middle" class="lbl">validate</text>
  <text x="700" y="340" text-anchor="middle" class="lbl">schema+rules</text>

  <rect x="758" y="278" width="250" height="86" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="883" y="308" text-anchor="middle" class="box-t">Orchestrator</text>
  <text x="883" y="328" text-anchor="middle" class="box-s">orchestrate_health_</text>
  <text x="883" y="346" text-anchor="middle" class="box-s">assessment()</text>

  <line x1="1008" y1="321" x2="1120" y2="321" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="1064" y="313" text-anchor="middle" class="lbl">runs</text>
  <text x="1064" y="340" text-anchor="middle" class="lbl">pipeline ↓</text>

  <rect x="1122" y="278" width="250" height="86" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="1247" y="308" text-anchor="middle" class="box-t">HealthAssessment</text>
  <text x="1247" y="328" text-anchor="middle" class="box-t">Response</text>
  <text x="1247" y="348" text-anchor="middle" class="box-s">JSON → Client</text>

  <!-- response back to client -->
  <path d="M1122,300 C820,250 460,250 160,270" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="640" y="246" text-anchor="middle" class="lbl-i" fill="#0284c7">structured JSON response</text>

  <!-- ================= AGENT PIPELINE BAND ================= -->
  <rect x="40" y="400" width="1560" height="210" rx="12" fill="#fbfdff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="428" class="band" fill="#7c3aed">② Agent pipeline (sequential) — each agent calls Gemini via core.llm.llm_generate()  [structured output → retry → text fallback]</text>

  <!-- agent boxes -->
  <!-- 1 symptom -->
  <rect x="70" y="452" width="330" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
  <circle cx="96" cy="478" r="13" fill="#0e7490"/><text x="96" y="483" text-anchor="middle" class="num">1</text>
  <text x="118" y="483" class="box-t">Symptom Agent</text>
  <text x="88" y="508" class="box-s">Extract symptoms, severity,</text>
  <text x="88" y="527" class="box-s">duration, primary complaint,</text>
  <text x="88" y="546" class="box-s">urgency (low→emergency).</text>
  <text x="88" y="565" class="box-s">+ RAG context retrieval</text>

  <!-- 2 doctor -->
  <rect x="440" y="452" width="330" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
  <circle cx="466" cy="478" r="13" fill="#0e7490"/><text x="466" y="483" text-anchor="middle" class="num">2</text>
  <text x="488" y="483" class="box-t">Doctor Agent</text>
  <text x="458" y="508" class="box-s">LLM picks specialty → query</text>
  <text x="458" y="527" class="box-s">SQLite by specialty, rank by</text>
  <text x="458" y="546" class="box-s">rating, top-3 recommendations.</text>

  <!-- 3 scheduling -->
  <rect x="810" y="452" width="330" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
  <circle cx="836" cy="478" r="13" fill="#0e7490"/><text x="836" y="483" text-anchor="middle" class="num">3</text>
  <text x="858" y="483" class="box-t">Scheduling Agent</text>
  <text x="828" y="508" class="box-s">Generate slots (urgency →</text>
  <text x="828" y="527" class="box-s">lead time), LLM selects best</text>
  <text x="828" y="546" class="box-s">slot; graceful fallback.</text>

  <!-- 4 summary -->
  <rect x="1180" y="452" width="330" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
  <circle cx="1206" cy="478" r="13" fill="#0e7490"/><text x="1206" y="483" text-anchor="middle" class="num">4</text>
  <text x="1228" y="483" class="box-t">Summary Agent</text>
  <text x="1198" y="508" class="box-s">Synthesize findings, next</text>
  <text x="1198" y="527" class="box-s">steps, urgency + mandatory</text>
  <text x="1198" y="546" class="box-s">medical disclaimer.</text>

  <!-- pipeline arrows -->
  <line x1="400" y1="512" x2="438" y2="512" stroke="#0e7490" stroke-width="2" marker-end="url(#arwT)"/>
  <line x1="770" y1="512" x2="808" y2="512" stroke="#0e7490" stroke-width="2" marker-end="url(#arwT)"/>
  <line x1="1140" y1="512" x2="1178" y2="512" stroke="#0e7490" stroke-width="2" marker-end="url(#arwT)"/>

  <!-- ================= INFRA BAND ================= -->
  <rect x="40" y="650" width="1560" height="170" rx="12" fill="#fefefe" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="678" class="band" fill="#475569">③ External services &amp; data</text>

  <rect x="70" y="694" width="470" height="104" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="305" y="726" text-anchor="middle" class="box-t">Google Gemini  (via LangChain)</text>
  <text x="305" y="750" text-anchor="middle" class="box-s">ChatGoogleGenerativeAI — LLM (structured output)</text>
  <text x="305" y="770" text-anchor="middle" class="box-s">GoogleGenerativeAIEmbeddings — text embeddings</text>
  <text x="305" y="789" text-anchor="middle" class="box-s">model: gemini-2.0-flash · temp 0.2</text>

  <rect x="580" y="694" width="440" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="800" y="726" text-anchor="middle" class="box-t">Pinecone — Vector store (RAG)</text>
  <text x="800" y="750" text-anchor="middle" class="box-s">cosine · serverless · top-k retrieval</text>
  <text x="800" y="770" text-anchor="middle" class="box-s">medical knowledge context for</text>
  <text x="800" y="789" text-anchor="middle" class="box-s">symptom analysis</text>

  <rect x="1060" y="694" width="450" height="104" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
  <text x="1285" y="726" text-anchor="middle" class="box-t">SQLite (SQLAlchemy)</text>
  <text x="1285" y="750" text-anchor="middle" class="box-s">doctors · appointments · session_logs</text>
  <text x="1285" y="770" text-anchor="middle" class="box-s">specialty / rating queries</text>
  <text x="1285" y="789" text-anchor="middle" class="box-s">data/healthlink.db</text>

  <!-- connectors agents -> infra -->
  <!-- symptom -> gemini -->
  <path d="M180,572 L230,694" fill="none" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <!-- symptom -> pinecone -->
  <path d="M300,572 L640,694" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="470" y="642" text-anchor="middle" class="lbl-i" fill="#16a34a">retrieve context</text>
  <!-- doctor -> gemini -->
  <path d="M540,572 L400,694" fill="none" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <!-- doctor -> sqlite -->
  <path d="M700,572 L1120,694" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="905" y="638" text-anchor="middle" class="lbl-i" fill="#e11d48">match doctors</text>
  <!-- scheduling -> gemini -->
  <path d="M900,572 L470,694" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arw)"/>
  <!-- summary -> gemini -->
  <path d="M1270,572 L520,696" fill="none" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arw)"/>
  <text x="150" y="640" text-anchor="middle" class="lbl-i" fill="#ca8a04">LLM calls (all agents)</text>

  <!-- footer note -->
  <text x="40" y="860" class="box-s">Resilience: every agent has try/except fallbacks — if Gemini or Pinecone is unavailable, the pipeline still returns a valid structured response (degraded).</text>
  <text x="40" y="882" class="box-s">Other endpoints: GET /api/v1/health · GET /api/v1/doctors?specialty=&amp;limit= · GET /api/v1/doctors/{id} · GET /api/v1/specialties</text>
</svg>
</div>
</body>
</html>
